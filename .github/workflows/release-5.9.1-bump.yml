name: release-5.9.1-bump

on:
  push:
    branches:
      - release/5.9.1

permissions:
  contents: write

jobs:
  bump:
    if: github.event.head_commit.message == 'chore: prepare 5.9.1 release metadata bump'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/5.9.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Bump release metadata
        shell: python
        run: |
          from pathlib import Path
          import json

          replacements = {
              Path('README.md'): [('5.9.0', '5.9.1')],
              Path('SKILL.md'): [('5.9.0', '5.9.1')],
              Path('.github/workflows/offline-ci.yml'): [('originplot-skill-v5.9.0.zip', 'originplot-skill-v5.9.1.zip')],
              Path('references/current-contract.md'): [('distributed by release v5.9.0', 'distributed by release v5.9.1')],
              Path('references/profiles/release.md'): [('distributed in release 5.9.0', 'distributed in release 5.9.1')],
              Path('tests/test_release_version_model.py'): [('5.9.0', '5.9.1')],
              Path('tests/test_v589_aa2195_reproduction.py'): [('OriginPlot Skill v5.9.0', 'OriginPlot Skill v5.9.1'), ('self.assertEqual("5.9.0", versions["release_version"])', 'self.assertEqual("5.9.1", versions["release_version"])')],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected release string in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          version_path = Path('version.json')
          version = json.loads(version_path.read_text(encoding='utf-8'))
          if version != {'release_version': '5.9.0', 'contract_version': '5.8.9-p18', 'evidence_version': '5.8.9-p18'}:
              raise SystemExit(f'unexpected version.json: {version}')
          version['release_version'] = '5.9.1'
          version_path.write_text(json.dumps(version, indent=2) + '\n', encoding='utf-8')

          evidence_path = Path('references/aa2195-release-evidence.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          if evidence.get('release_version') != '5.9.0':
              raise SystemExit('unexpected evidence release version')
          if evidence.get('contract_version') != '5.8.9-p18' or evidence.get('evidence_version') != '5.8.9-p18':
              raise SystemExit('refusing to relabel contract/evidence identity')
          evidence['release_version'] = '5.9.1'
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          changelog = Path('references/changelog.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## v5.9.0\n'
          if marker not in text:
              raise SystemExit('missing v5.9.0 changelog marker')
          entry = (
              '## v5.9.1\n\n'
              '- Hardened XLSX FigureSpec loading so read-only workbooks close deterministically and missing worksheets fail with stable `E309_XLSX_SHEET_MISSING`.\n'
              '- Hardened elevated Windows worker launch by resolving `pwsh`/`powershell` from PATH before the legacy PowerShell 7 location and normalizing process-start failures to `E120_ENVIRONMENT_MISMATCH`.\n'
              '- Added dependency-free regression coverage for XLSX cleanup/error semantics and PowerShell fallback behavior.\n'
              '- Retained the `5.8.9-p18` functional contract and AA2195 evidence identity; this maintenance release does not claim new live-Origin evidence.\n\n'
          )
          changelog.write_text(text.replace(marker, entry + marker, 1), encoding='utf-8')

          Path('.github/workflows/release-5.9.1-bump.yml').unlink()
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md SKILL.md .github/workflows/offline-ci.yml references/current-contract.md references/profiles/release.md references/aa2195-release-evidence.json references/changelog.md tests/test_release_version_model.py tests/test_v589_aa2195_reproduction.py version.json .github/workflows/release-5.9.1-bump.yml
          git commit -m "release: bump OriginPlot package to 5.9.1"
          git push origin HEAD:release/5.9.1
