name: offline-ci

on:
  push:
  pull_request:

jobs:
  v6-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
      - name: Install offline dependencies
        run: python -m pip install -r requirements-core.txt -r requirements-dev.txt
      - name: Compile v6 core
        run: python -m compileall originplot scripts tests benchmarks
      - name: Pytest
        run: python -m pytest -q
      - name: Packaged v6 test runner
        run: python scripts/run_all_tests.py
      - name: Dependency boundary audit
        run: python scripts/audit_dependencies.py
      - name: Read-only doctor contract
        run: python -m originplot.cli.main doctor --origin-version 2022
      - name: Build and validate shareable package
        run: |
          python scripts/build_shareable_package_v6.py --skill-dir . --zip-out "$env:RUNNER_TEMP\originplot-v6.zip"
          python scripts/validate_shareable_package_v6.py --path "$env:RUNNER_TEMP\originplot-v6.zip"

# Offline CI intentionally does not launch Origin and never claims live Origin E2E.
