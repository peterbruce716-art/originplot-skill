name: offline-ci

on:
  push:
  pull_request:

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v6-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
      - name: Install offline dependencies
        run: python -m pip install -r requirements-core.txt -r requirements-dev.txt
      - name: Compile v6 core
        run: python -m compileall originplot scripts tests benchmarks
      - name: Pytest
        run: python -m pytest -q
      - name: Packaged v6 test runner
        run: python scripts/run_all_tests.py
      - name: Dependency boundary audit
        run: python scripts/audit_dependencies.py
      - name: Read-only doctor contract
        run: python -m originplot.cli.main doctor --origin-version 2022
      - name: Installed package isolation smoke
        shell: pwsh
        run: |
          python -m pip install . --no-deps --target "$env:RUNNER_TEMP\originplot-installed"
          $smoke = Join-Path $env:RUNNER_TEMP "originplot-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Push-Location $smoke
          $env:PYTHONPATH = "$env:RUNNER_TEMP\originplot-installed"
          python -c "from pathlib import Path; import originplot.controller; import originplot.template.gallery; import originplot.runtime.worker; import originplot.runtime as rt; from originplot.runtime.doctor import doctor; launcher=Path(rt.__file__).resolve().parent/'run_origin_worker_elevated.ps1'; assert launcher.is_file(), launcher; result=doctor('2022'); caps=result['origin']['capabilities']; assert caps['profile_found'], caps; assert caps['profile_schema']=='originplot.capabilities.v6', caps; assert result['administrator']['policy_changed_in_v6'] is False"
          Pop-Location
      - name: Build and validate shareable package
        run: |
          python scripts/build_shareable_package_v6.py --skill-dir . --zip-out "$env:RUNNER_TEMP\originplot-v6.zip"
          python scripts/validate_shareable_package_v6.py --path "$env:RUNNER_TEMP\originplot-v6.zip"

# Offline CI intentionally does not launch Origin and never claims live Origin E2E.
