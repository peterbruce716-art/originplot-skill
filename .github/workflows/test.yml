name: v6.1 validation

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.8,<1" pytest
          if [ -f pyproject.toml ]; then pip install -e '.[test]' || pip install -e .; fi

      - name: Import boundary check
        run: python -c "import originplot"

      - name: Skill doctor
        run: python scripts/skill_doctor.py

      - name: Ruff check
        run: |
          echo '=== Ruff check start ==='
          ruff check . --config ruff.toml
          echo '=== Ruff check done ==='

      - name: Ruff format check
        run: |
          echo '=== Ruff format check start ==='
          changed=$(git diff --name-only HEAD^ HEAD -- '*.py' || true)
          if [ -n "$changed" ]; then
            echo "$changed"
            ruff format --check $changed --config ruff.toml
          else
            echo 'No changed Python files; skipping format validation.'
          fi
          echo '=== Ruff format check done ==='

      - name: Verify test layout
        run: |
          test -d tests || (echo 'Missing tests directory' && exit 1)
          test -d tests/capability || (echo 'Missing capability tests' && exit 1)
          test -d tests/fail_closed || (echo 'Missing fail-closed tests' && exit 1)
          test -d tests/package_boundary || (echo 'Missing package boundary tests' && exit 1)

      - name: Run tests
        run: pytest -q

      - name: CI diagnostics on failure
        if: failure()
        run: |
          echo '=== Python ==='
          python --version
          echo '=== Tool versions ==='
          python -m pip --version
          ruff --version
          pytest --version
          echo '=== Installed packages ==='
          python -m pip freeze
          echo '=== Git revision ==='
          git rev-parse HEAD
