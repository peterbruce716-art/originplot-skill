name: v6.1 validation

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e '.[test]' || pip install -e .; fi

      - name: Import boundary check
        run: python -c "import originplot"

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest -q; else echo 'No tests directory yet'; fi
